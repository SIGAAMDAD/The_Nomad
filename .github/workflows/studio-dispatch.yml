name: Studio V5 / Signed Dispatch and Recovery

on:
  issues:
    types: [labeled, reopened, closed]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [studio_v5_enqueue]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number (blank scans all eligible tasks)"
        required: false
        type: string
      dry_run:
        description: "Validate and preview only"
        required: false
        default: true
        type: boolean
      reconcile_only:
        description: "Reconcile acknowledgments without dispatch"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: studio-v5-dispatch-queue
  cancel-in-progress: false

jobs:
  orchestrate:
    if: >-
      github.event_name != 'issue_comment' ||
      contains(github.event.comment.body, 'STUDIO_EVENT')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed control plane
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: Nomad3D
      - name: Reconcile and dispatch signed assignments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STUDIO_ENABLED: ${{ vars.STUDIO_ENABLED }}
          STUDIO_APPROVAL_KEY: ${{ secrets.STUDIO_APPROVAL_KEY }}
          STUDIO_SLACK_WEBHOOK: ${{ secrets.STUDIO_SLACK_WEBHOOK }}
          TASK_NUMBER: ${{ inputs.issue_number }}
          TASK_DRY_RUN: ${{ inputs.dry_run }}
          TASK_RECONCILE_ONLY: ${{ inputs.reconcile_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$TASK_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 studio/orchestrator.py --mode reconcile "${args[@]}"
          if [[ "$TASK_RECONCILE_ONLY" != "true" ]]; then
            if [[ -n "$TASK_NUMBER" ]]; then
              args+=(--issue "$TASK_NUMBER")
            fi
            python3 studio/orchestrator.py --mode dispatch "${args[@]}"
          fi
