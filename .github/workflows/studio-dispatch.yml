name: Studio v4 / Issue Dispatcher

on:
  issues:
    types: [labeled, reopened]
  repository_dispatch:
    types: [studio_enqueue]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number; leave empty to scan the approved queue"
        type: string
        required: false
      dry_run:
        description: "Preview dispatch with no Slack message or issue mutation"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: nomad-studio-issue-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name != 'issues' ||
      github.event.action == 'reopened' ||
      github.event.label.name == 'ai:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout dispatcher code on the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and dispatch approved issues
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_ENABLED: ${{ vars.STUDIO_ENABLED }}
          STUDIO_SLACK_WEBHOOK: ${{ secrets.STUDIO_SLACK_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          PAYLOAD_ISSUE: ${{ github.event.client_payload.issue_number }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$EVENT_NAME" == "issues" && -n "$EVENT_ISSUE" ]]; then
            args=(--issue "$EVENT_ISSUE")
          elif [[ -n "$INPUT_ISSUE" ]]; then
            args=(--issue "$INPUT_ISSUE")
          elif [[ -n "$PAYLOAD_ISSUE" ]]; then
            args=(--issue "$PAYLOAD_ISSUE")
          else
            args=(--scan)
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 studio/dispatcher.py "${args[@]}"
